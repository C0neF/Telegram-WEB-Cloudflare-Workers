name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Unit tests — app
        working-directory: app
        run: npm test
      - name: Workers runtime tests
        working-directory: app
        run: npm run test:runtime
      - name: Wrangler dry-run — app entry
        working-directory: app
        run: npm run deploy:dry
      - name: Wrangler dry-run — root entry
        run: node app/node_modules/wrangler/bin/wrangler.js deploy --dry-run --config wrangler.toml
      - name: Wrangler dry-run — validation probe
        working-directory: validation/cloudflare-probe
        run: node ../../app/node_modules/wrangler/bin/wrangler.js deploy --dry-run --config wrangler.toml
      - name: Unit tests — validation
        working-directory: validation
        run: npm test
      - name: Check syntax
        run: |
          npm --prefix app run lint
          node --check validation/src/*.js
          node --check validation/test/*.js
