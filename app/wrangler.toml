# Telegram WEB Proxy — Cloudflare Worker + SQLite Durable Object
# Compatible with telegramdesktop/tproxy-server@52a5feb7 / Desktop v7.1.2
# $0 target: Workers Free + SQLite Durable Objects Free only

name = "telegram-web-cloudflare-workers"
main = "src/index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put PROXY_SECRET` — never commit)
# PROXY_SECRET = 32 hex chars (plain) or dd + 32 hex chars (padded-intermediate)

[vars]
# Set RELAY_DEBUG = "1" to enable verbose relay diagnostics (off by default)
# RELAY_DEBUG = "0"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDO"]
